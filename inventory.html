<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Party Inventory</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2e;
            --text-main: #f0f4f8;
            --accent: #8b5cf6;
            --color-Bronze: #cd7f32;
            --color-Silver: #c0c0c0;
            --color-Gold: #ffd700;
            --color-Platinum: #e5e4e2;
            --color-Legendary: #ff4500;
            --color-Celestial: #00ffff;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent); margin-bottom: 5px; }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 2px solid #2e344e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #2e344e;
            padding-bottom: 8px;
        }

        .item-title { font-size: 18px; font-weight: bold; margin: 0; }
        .rating-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
        }

        .item-ability {
            font-size: 14px;
            color: #d8dee9;
            line-height: 1.4;
            background: #0f111a;
            padding: 10px;
            border-radius: 4px;
            margin: 5px 0 0 0;
        }

        .delete-btn {
            background: #ef4444; color: white; border: none; padding: 5px 10px;
            font-size: 11px; border-radius: 4px; cursor: pointer; margin-top: 10px;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #a6adbb; }
        input[type="text"], select, textarea {
            width: 100%; padding: 10px; background-color: #0f111a; color: #fff;
            border: 2px solid #3b4252; border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 60px; }
        
        .action-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white; border: none; padding: 12px 20px; font-size: 15px;
            font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;
        }

        footer { margin-top: 40px; text-align: center; border-top: 1px solid #2e344e; padding-top: 20px; }
        .admin-link-btn { background: none; border: none; color: #4c566a; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .admin-link-btn:hover { color: var(--accent); }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; display:flex; align-items:center; justify-content:center; }
        .modal-content { background: var(--card-bg); border: 2px solid #3b4252; padding: 25px; border-radius: 8px; width: 320px; }
        .status-msg { font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .status-success { color: #22c55e; } .status-error { color: #ef4444; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .modal-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .modal-btn.confirm { background-color: var(--accent); color: white; }
        .modal-btn.cancel { background-color: #3b4252; color: white; }

        .hidden { display: none !important; }
        .no-items { font-style: italic; color: #4c566a; text-align: center; width: 100%; grid-column: 1 / -1; margin-top: 30px; }

        /* Dynamic Border/Badge Tier colors */
        .border-Bronze { border-color: var(--color-Bronze); } .badge-Bronze { background-color: var(--color-Bronze); }
        .border-Silver { border-color: var(--color-Silver); } .badge-Silver { background-color: var(--color-Silver); }
        .border-Gold { border-color: var(--color-Gold); } .badge-Gold { background-color: var(--color-Gold); }
        .border-Platinum { border-color: var(--color-Platinum); } .badge-Platinum { background-color: var(--color-Platinum); }
        .border-Legendary { border-color: var(--color-Legendary); } .badge-Legendary { background-color: var(--color-Legendary); color: white; }
        .border-Celestial { border-color: var(--color-Celestial); box-shadow: 0 0 10px rgba(0,255,255,0.3); } .badge-Celestial { background-color: var(--color-Celestial); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📜 Party Key Items Vault</h1>
            <p>A live archive tracking the party's critical relics and discoveries.</p>
        </header>

        <!-- Private DM Creation Terminal (Hidden until correct Admin Login) -->
        <section id="admin-creator-panel" class="form-card hidden">
            <h3 style="margin-top:0; color:var(--accent);">🛠️ Artifact Minting Terminal</h3>
            <div class="form-group">
                <label>Item Name:</label>
                <input type="text" id="new-item-name" placeholder="e.g. Ancient Datapad, Crypt Key...">
            </div>
            <div class="form-group">
                <label>Rating / Rarity Classification:</label>
                <select id="new-item-tier">
                    <option value="Bronze">Bronze</option>
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                    <option value="Platinum">Platinum</option>
                    <option value="Legendary">Legendary</option>
                    <option value="Celestial">Celestial</option>
                </select>
            </div>
            <div class="form-group">
                <label>Item Ability / Properties:</label>
                <textarea id="new-item-ability" placeholder="Describe what use this key item serves..."></textarea>
            </div>
            <button class="action-btn" onclick="createNewKeyItem()">Manifest Item into Vault</button>
        </section>

        <!-- Public Live Vault Display Grid -->
        <h3 style="border-bottom: 2px solid #2e344e; padding-bottom: 8px;">🎒 Vault Manifest</h3>
        <div id="vault-grid-container" class="inventory-grid">
            <div class="no-items">Connecting to campaign grid logs...</div>
        </div>

        <footer>
            <button id="admin-trigger-btn" class="admin-link-btn">🔒 Master DM Authentication</button>
            <br><br>
            <a href="index.html" style="color:#8b5cf6; text-decoration:none; font-size:14px; font-weight:bold;">📦 Return to Loot Boxes</a>
        </footer>
    </div>

    <!-- Login Modal Box Override -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--accent);">Syndicate Authentication</h3>
            <div id="login-status-msg" class="status-msg"></div>
            <div class="form-group">
                <label>Syndicate ID:</label>
                <input type="text" id="admin-id-input">
            </div>
            <div class="form-group">
                <label>Access Password:</label>
                <input type="password" id="admin-pass-input">
            </div>
            <div class="modal-actions">
                <button class="modal-btn confirm" onclick="attemptAdminVerification()">Verify</button>
                <button class="modal-btn cancel" onclick="closeAuthModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const MASTER_ID = "Syndicate99";
        const MASTER_PASSWORD = "Password123";
        
        // 📡 NEW FOLDER EXTENSION: Points directly to an inventory bucket separate from the lockout switches
        const DATABASE_API_URL = "https://firebaseio.com";

        let isAdminAuthenticated = false;
        let loadedVaultItems = {};

        // Auto-fetch data when the page wakes up
        document.addEventListener("DOMContentLoaded", fetchVaultItems);

        function attemptAdminVerification() {
            const id = document.getElementById('admin-id-input').value.trim();
            const pass = document.getElementById('admin-pass-input').value.trim();
            const msg = document.getElementById('login-status-msg');

            if (id === MASTER_ID && pass === MASTER_PASSWORD) {
                msg.className = "status-msg status-success";
                msg.textContent = "Authorized. Minting terminal ready.";
                isAdminAuthenticated = true;
                setTimeout(() => {
                    document.getElementById('login-modal').classList.add('hidden');
                    document.getElementById('admin-creator-panel').classList.remove('hidden');
renderInventory(); // Redraw menu to show remove controls if validated
}, 1000);
} else {
msg.className = "status-msg status-error";
msg.textContent = "Access Denied. Invalid credentials.";
}
}
function fetchVaultItems() {
fetch(DATABASE_API_URL)
.then(res => res.json())
.then(data => {
loadedVaultItems = data || {};
renderInventory();
}).catch(err => console.log("Inventory load error:", err));
}
function renderInventory() {
const grid = document.getElementById('vault-grid-container');
grid.innerHTML = "";
const keys = Object.keys(loadedVaultItems);
if (keys.length === 0) {
grid.innerHTML = 'The item vault is currently empty.';
return;
}
keys.forEach(firebaseKey => {
const item = loadedVaultItems[firebaseKey];
const card = document.createElement('div');
card.className = item-card border-${item.tier};
card.innerHTML = <div class="item-header"> <h4 class="item-title">${item.name}</h4> <span class="rating-badge badge-${item.tier}">${item.tier}</span> </div> <p class="item-ability">${item.ability}</p>;
// If logged in as DM, append a real-time wipe switch to the bottom row card slots
if (isAdminAuthenticated) {
const del = document.createElement('button');
del.className = "delete-btn";
del.textContent = "🗑️ Destroy Relic";
del.onclick = () => wipeItemEntry(firebaseKey);
card.appendChild(del);
}
grid.appendChild(card);
});
}
function createNewKeyItem() {
const name = document.getElementById('new-item-name').value.trim();
const tier = document.getElementById('new-item-tier').value;
const ability = document.getElementById('new-item-ability').value.trim();
if (!name || !ability) {
alert("Manifest error: Items require a valid tracking designation name and structural rules properties text.");
return;
}
const itemPayload = { name, tier, ability };
// Send payload to database bucket
fetch(DATABASE_API_URL, {
method: "POST", // POST tells Firebase to automatically generate a unique ID tag for the item
headers: { "Content-Type": "application/json" },
body: JSON.stringify(itemPayload)
}).then(() => {
// Clear input boxes
document.getElementById('new-item-name').value = "";
document.getElementById('new-item-ability').value = "";
fetchVaultItems(); // Force screen update immediately
}).catch(err => alert("Minting error layout connection drop: " + err));
}
function wipeItemEntry(keyID) {
if (!confirm("Are you sure you want to permanently delete this item from the party inventory?")) return;
// Target the specific unique item link directly inside the cloud layout network path
const targetUrl = https://firebaseio.com{keyID}.json;
fetch(targetUrl, { method: "DELETE" })
.then(() => fetchVaultItems())
.catch(err => alert("Wipe transmission dropping link configurations handles: " + err));
}
document.getElementById('admin-trigger-btn').addEventListener('click', () => {
document.getElementById('login-modal').classList.remove('hidden');
document.getElementById('login-status-msg').textContent = "";
document.getElementById('admin-id-input').value = "";
document.getElementById('admin-pass-input').value = "";
});
function closeAuthModal() { document.getElementById('login-modal').classList.add('hidden'); }
