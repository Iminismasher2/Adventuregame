<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Loot Box Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 DM Campaign Loot Roller 🎲</h1>
            <p>Select a crate tier, choose your category modifier, and spin for loot!</p>
        </header>

        <main class="grid-layout">
            <!-- Left Side: Controls -->
            <section class="controls-card">
                <div class="form-group">
                    <label for="tier-select">📦 Select Box Tier:</label>
                    <select id="tier-select">
                        <option value="Bronze">Bronze</option>
                        <option value="Silver">Silver</option>
                        <option value="Gold">Gold</option>
                        <option value="Platinum">Platinum</option>
                        <option value="Legendary">Legendary</option>
                        <option value="Celestial">Celestial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category-select">🏷️ Loot Table Tag / Category:</label>
                    <select id="category-select">
                        <option value="patron">Patron (Race Homeworld)</option>
                        <option value="race">Your Character Race</option>
                        <option value="class">Character Class</option>
                        <option value="motivation">Character Motivation</option>
                        <option value="looter">Looter</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="sub-category-label" for="sub-category-select">🌍 Select Option:</label>
                    <select id="sub-category-select"></select>
                </div>

                <button id="spin-btn" class="spin-button">✨ Open Loot Box ✨</button>
            </section>

            <!-- Right Side: CS:GO Style Case Opener Display -->
            <section class="display-card">
                <h2>Case Opener</h2>
                
                <!-- CS:GO Rolling Case Viewport -->
                <div class="case-container">
                    <div class="case-ticker-line"></div>
                    <div id="case-scroller" class="case-scroller"></div>
                </div>

                <!-- Final Reward Card (Hidden until animation finishes) -->
                <div id="loot-display-container" class="loot-display hidden">
                    <div id="item-rating-badge" class="rating-badge">Bronze</div>
                    <img id="item-image" src="" alt="Loot Reward Image">
                    <h3 id="item-name">Item Name</h3>
                    <p id="item-ability">Item ability or description.</p>
                </div>
                
                <div id="placeholder-text" class="placeholder-text">
                    Ready to unbox...
                </div>
            </section>
        </main>
    </div>

    <!-- Audio element for the CS:GO click tick sound -->
    <audio id="tick-sound" src="https://google.com" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
